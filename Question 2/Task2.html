<!DOCTYPE html>
<html>
<head>
    <style>
        body{
            background-color:lightyellow;
        }
    </style>
</head>
<body>
    <form>
        Family name: <input type="text" placeholder="Family name"><br><br>
        Other name: <input type="text" placeholder="Other names"><br><br>
        Address: <input type="text" placeholder="Address"><br><br>
        Suburb:
        <select>
            <option>Vic</option>
            <option>NSW</option>
            <option>Queensland</option>
        </select><br><br>
        State/Territory: <input type="text"><br><br>

        Course Info On:<br>
        <input type="checkbox">Engineering<br>
        <input type="checkbox">IT<br>
        <input type="checkbox">Law<br>
        <input type="checkbox">Medicine<br>
        <input type="checkbox">Nursing<br><br>

        Degree:<br>
        <input type="radio" name="degree">Diploma<br>
        <input type="radio" name="degree">Degree<br>
        <input type="radio" name="degree">Honours<br>
        <input type="radio" name="degree">Masters<br>
        <input type="radio" name="degree">PhD<br><br>

        Comments:<br>
        <textarea rows="5" cols="40"></textarea><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Clear Form</button>
    </form>
</body>
</html>
