<!DOCTYPE html>
<html>
<head>
    <title>Div Layout</title>
    <style>
        body{
            margin: 0;
        }
        .header{
            background-color: green;
            color: white;
            text-align: center;
            font-size: 24px;
            height: 40px;
        }
        .left{
            background-color: magenta;
            float: left;
            width: 20%;
            height: 400px;
            text-align: center;
        }
        .center{
            background-color: red;
            float: left;
            width: 55%;
            height: 400px;
            text-align: center;
        }
        .right{
            background-color: lime;
            float: left;
            width: 25%;
            height: 400px;
            text-align: center;
        }
        .footer{
            background-color: green;
            color: white;
            text-align: center;
            font-size: 24px;
            height: 40px;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="header">This is header</div>
    <div class="left">Left Content</div>
    <div class="center">Center Content</div>
    <div class="right">Right Content</div>
    <div class="footer">Footer</div>
</body>
</html>
