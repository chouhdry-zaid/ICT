<!DOCTYPE html>
<html>
<head>
    <title>Timetable</title>
    <style>
        table{
            border: 2px solid black;
            border-collapse: collapse;
            width: 80%;
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th{
            background-color: cadetblue;
            color: white;
        }
        td{
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <h1>Class Timetable</h1>
    <table>
        <tr>
            <th>Day</th>
            <th>9:00 - 10:00</th>
            <th>10:00 - 11:00</th>
            <th>11:00 - 12:00</th>
            <th>12:00 - 1:00</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>ICT</td>
            <td>Maths</td>
            <td>English</td>
            <td>Physics</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>English</td>
            <td>ICT</td>
            <td>Physics</td>
            <td>Maths</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>Maths</td>
            <td>Physics</td>
            <td>ICT</td>
            <td>English</td>
        </tr>
        <tr>
            <td>Thursday</td>
            <td>Physics</td>
            <td>English</td>
            <td>Maths</td>
            <td>ICT</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>ICT Lab</td>
            <td>ICT Lab</td>
            <td>Islamiat</td>
            <td>Free</td>
        </tr>
    </table>
</body>
</html>
